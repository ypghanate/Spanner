[project]
name = "spanner"
version = "0.1.0"
description = "Live AI repair assistant for iPhone (Imperial AI Hackathon)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic>=2",
    "anthropic",
    "python-dotenv",
    "httpx",
    "pillow",
    "opencv-python-headless",
    "numpy",
    "imagehash",
    "ultralytics",
    "elevenlabs",
    "youtube-transcript-api",
    "databricks-sql-connector",
    "databricks-sdk",
    "fal-client",
    "lap>=0.5.12",
    "chromadb>=1.5.9",
    "qrcode[pil]>=8",       # the pairing QR at /coach/qr
]

[dependency-groups]
dev = ["pytest"]
# Training / knowledge pipeline + Linkup parts agent (training/, databricks/, backend/parts_agent.py).
# Not needed to run the live backend: `uv sync --group training` only on the machine that builds data.
training = [
    "faster-whisper",
    "tavily-python>=0.8",
    "linkup-sdk>=0.24",
    "mlflow-skinny>=3.18",
    "google-genai",      # Gemini watches YouTube tutorials by URL (training/youtube_labels.py)
    "trimesh",           # procedural 3D model of the demo object (training/scene3d.py)
    "scipy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: needs real API keys and network (deselect with -m 'not live')"]
addopts = "-m 'not live'"
