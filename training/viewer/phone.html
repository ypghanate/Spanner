<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Spanner · phone camera</title>
<style>
  :root { --base:#101512; --raised:#253027; --text:#f2f2e9; --muted:#a0a99f; --action:#caf879; --on-action:#172415; --danger:#f3917c; --warn:#ffd166; }
  html,body { margin:0; height:100%; background:var(--base); color:var(--text); font-family:Inter,"Segoe UI",system-ui,sans-serif; }
  video { width:100vw; height:100vh; object-fit:cover; display:block; background:#000; }
  #hud { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); padding:12px 14px; background:var(--base); border-radius:12px; font-size:12px; font-weight:500; display:flex; gap:10px; align-items:center; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--danger); flex:none; } .dot.on { background:var(--action); }
  #box { position:fixed; border:2px solid var(--action); border-radius:8px; display:none; pointer-events:none; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; background:var(--base); text-align:center; padding:24px; }
  #start b { font-size:26px; font-weight:500; } #start small { color:var(--muted); font-size:13px; line-height:1.5; max-width:320px; }
  #go { margin-top:8px; height:52px; padding:0 28px; border:0; border-radius:8px; background:var(--action); color:var(--on-action); font:600 15px inherit; font-family:inherit; }
</style></head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="box"></div>
<div id="hud"><span class="dot" id="dot"></span><span id="st">starting</span><span id="tl" style="margin-left:auto;color:var(--warn);white-space:nowrap"></span></div>
<div id="start"><b>Spanner phone camera</b><small>Point the rear camera at the keyboard and your hands. Keep the whole keyboard in view and the screen on.</small><button id="go">Start the camera</button></div>
<script type="module">
import { watchPalm } from "./gesture.js";
import { watchLight, videoLuma } from "./torch.js";
const QP = new URLSearchParams(location.search), S = QP.get("s") || "phone", API = "";
const v = document.getElementById("v"), st = document.getElementById("st"), dot = document.getElementById("dot"), box = document.getElementById("box");
const c = document.createElement("canvas"), lc = document.createElement("canvas");
let busyFrame = false, busyPose = false, nFrames = 0, lastLat = 0, frameErr = "", lastOk = 0, wake = null, running = false;

/** fetch with a deadline: a dead Wi-Fi link must not leave the loops waiting for minutes with the HUD looking fine */
function fetchT(url, init, ms) { const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms); return fetch(url, { ...init, signal: ctl.signal }).finally(() => clearTimeout(t)); }
function grab(w, q) {
  const h = Math.round(w * v.videoHeight / v.videoWidth); c.width = w; c.height = h;
  c.getContext("2d").drawImage(v, 0, 0, w, h);
  return new Promise((ok, no) => c.toBlob((b) => (b ? ok(b) : no(new Error("could not read the camera"))), "image/jpeg", q));
}
async function post(path, blob, extra, ms) {
  const fd = new FormData(); fd.append("image", blob, "f.jpg"); fd.append("session", S);
  for (const [k, val] of Object.entries(extra || {})) fd.append(k, val);
  const r = await fetchT(API + path, { method: "POST", body: fd }, ms);
  if (!r.ok) throw new Error(path.split("/").pop() + " " + r.status);
  return r.json();
}
const streaming = () => v.srcObject && v.srcObject.getVideoTracks().some((t) => t.readyState === "live") && v.videoWidth;
function status() {
  const age = Date.now() - lastOk;
  const ok = lastOk && age < 4000;
  dot.classList.toggle("on", !!ok);
  if (!streaming()) st.textContent = "camera stopped · tap the screen to restart";
  else if (!lastOk) st.textContent = "connecting to your laptop…";
  else if (!ok) st.textContent = "can’t reach your laptop · retrying";
  else st.textContent = (frameErr ? "laptop coach: " + frameErr : "streaming") + ` · ${nFrames} frames` + (lastLat ? ` · coach ${(lastLat / 1000).toFixed(1)} s` : "");
}
async function poseLoop() {
  if (!busyPose && streaming()) {
    busyPose = true;
    try {
      const p = await post("/coach/pose", await grab(480, 0.7), null, 6000); lastOk = Date.now();
      if (p.found) {
        const W = innerWidth, H = innerHeight, s = Math.max(W / v.videoWidth, H / v.videoHeight), vw = v.videoWidth * s, vh = v.videoHeight * s, ox = (W - vw) / 2, oy = (H - vh) / 2;
        box.style.display = "block"; box.style.left = (ox + (p.cx - p.w / 2) * vw) + "px"; box.style.top = (oy + (p.cy - p.h / 2) * vh) + "px";
        box.style.width = (p.w * vw) + "px"; box.style.height = (p.h * vh) + "px"; box.style.transform = `rotate(${p.angle}deg)`;
      } else box.style.display = "none";
    } catch (e) { /* status() reports it */ }
    busyPose = false;
  }
  status(); setTimeout(poseLoop, 250);
}
async function frameLoop() {
  if (!busyFrame && streaming()) {
    busyFrame = true;
    try { const r = await post("/coach/frame", await grab(768, 0.82), { current_step: "0" }, 25000); nFrames++; lastLat = r.latency_ms; frameErr = ""; }
    catch (e) { frameErr = /429/.test(e.message) ? "" : /name|abort/i.test(e.name + e.message) ? "slow answer" : e.message; }
    busyFrame = false;
  }
  setTimeout(frameLoop, 1500);
}
// 🔦 the phone's flashlight follows the room: on when it is very dark (the coach cannot read a keycap it cannot see), off when
// the room is bright enough again. Android Chrome only: iPhone Safari has no torch control, and then this stays silent.
// ?torch=0 turns it off; ?dark=0.17 and ?light=0.30 set the two brightness limits; ?torchdebug=1 shows the live brightness.
let light = null;
function startLight() {
  if (light || QP.get("torch") === "0") return;
  const opts = {}; if (QP.get("dark")) opts.dark = +QP.get("dark"); if (QP.get("light")) opts.light = +QP.get("light");
  const tl = document.getElementById("tl"), dbg = QP.get("torchdebug") === "1";
  let lastLuma = null;
  light = watchLight({
    getTrack: () => v.srcObject && v.srcObject.getVideoTracks()[0],
    sampleLuma: () => { if (!streaming()) return null; try { lastLuma = videoLuma(v, lc); } catch { return null; } return lastLuma; },
    getExposure: () => { const st = v.srcObject && v.srcObject.getVideoTracks()[0]?.getSettings?.(); return st && typeof st.exposureTime === "number" ? st.exposureTime : null; },
    onChange: (i) => { tl.textContent = i.label ? "🔦 " + i.label : ""; },
    opts,
  });
  if (dbg) setInterval(() => { const g = light.governor; tl.textContent = `lum ${lastLuma === null ? "–" : lastLuma.toFixed(2)} · ${g.state}${g.room !== undefined ? " · room " + g.room.toFixed(2) : ""}`; }, 400);
}
async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch { /* not supported or refused */ } }
async function openCamera() {
  try {
    v.srcObject?.getTracks().forEach((t) => t.stop());
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    v.srcObject.getVideoTracks()[0].addEventListener("ended", status);
    await keepAwake(); return true;
  } catch (e) { st.textContent = "camera blocked: " + e.message + " (open this page over https and allow the camera)"; return false; }
}
// a locked or backgrounded phone freezes the stream: ask for the camera again when the page comes back
document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && running) { await keepAwake(); if (!streaming()) openCamera(); } });
document.body.addEventListener("click", () => { if (running && !streaming()) openCamera(); });
document.getElementById("go").onclick = async () => {
  if (!(await openCamera())) return;
  document.getElementById("start").remove(); running = true; startLight(); if (QP.get("track") === "1") poseLoop(); frameLoop();   // the hologram stays still unless ?track=1
  // ✋ raised open palm = "stop talking": the laptop picks the signal up from /coach/latest
  watchPalm(v, () => { fetch(API + "/coach/signal", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session: S, signal: "stop" }) }).catch(() => {}); st.textContent = "✋ stop sent"; });
  if (screen.orientation?.lock) screen.orientation.lock("landscape").catch(() => {});
};
</script>
</body></html>
