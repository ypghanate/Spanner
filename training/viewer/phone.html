<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Spanner · phone camera</title>
<style>
  :root { --bg:#05080F; --cyan:#00E5FF; --ok:#3DFFA8; --danger:#FF3D5A; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; }
  html,body { margin:0; height:100%; background:var(--bg); color:#e6fbff; font-family:var(--mono); }
  video { width:100vw; height:100vh; object-fit:cover; display:block; background:#000; }
  #hud { position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(0deg,#05080fee,#05080f00); font-size:12px; letter-spacing:.08em; }
  #hud b { color:var(--cyan); } .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--danger); margin-right:6px; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #box { position:fixed; border:2px solid var(--cyan); border-radius:4px; display:none; pointer-events:none; box-shadow:0 0 14px #00e5ff88; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:#05080fee; color:var(--cyan); letter-spacing:.2em; font-size:14px; text-align:center; padding:20px; }
  #start small { opacity:.7; letter-spacing:.08em; font-size:11px; }
</style></head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="box"></div>
<div id="hud"><span class="dot" id="dot"></span><b>SPANNER</b> · phone camera · <span id="st">starting</span></div>
<div id="start">TAP TO START THE CAMERA<small>point the rear camera at the keyboard and your hands; keep the whole keyboard in view</small></div>
<script type="module">
import { watchPalm } from "./gesture.js";
const QP = new URLSearchParams(location.search), S = QP.get("s") || "phone", API = "";
const v = document.getElementById("v"), st = document.getElementById("st"), dot = document.getElementById("dot"), box = document.getElementById("box");
const c = document.createElement("canvas");
let busyFrame = false, busyPose = false, nFrames = 0, nPoses = 0, lastLat = 0;
function grab(w, q) {
  const h = Math.round(w * v.videoHeight / v.videoWidth); c.width = w; c.height = h;
  c.getContext("2d").drawImage(v, 0, 0, w, h);
  return new Promise((ok) => c.toBlob(ok, "image/jpeg", q));
}
async function post(path, blob, extra) {
  const fd = new FormData(); fd.append("image", blob, "f.jpg"); fd.append("session", S);
  for (const [k, val] of Object.entries(extra || {})) fd.append(k, val);
  const r = await fetch(API + path, { method: "POST", body: fd }); if (!r.ok) throw new Error(r.status); return r.json();
}
async function poseLoop() {
  if (!busyPose && v.videoWidth) {
    busyPose = true;
    try {
      const p = await post("/coach/pose", await grab(480, 0.7)); nPoses++;
      if (p.found) {
        const W = innerWidth, H = innerHeight, s = Math.max(W / v.videoWidth, H / v.videoHeight), vw = v.videoWidth * s, vh = v.videoHeight * s, ox = (W - vw) / 2, oy = (H - vh) / 2;
        box.style.display = "block"; box.style.left = (ox + (p.cx - p.w / 2) * vw) + "px"; box.style.top = (oy + (p.cy - p.h / 2) * vh) + "px";
        box.style.width = (p.w * vw) + "px"; box.style.height = (p.h * vh) + "px"; box.style.transform = `rotate(${p.angle}deg)`;
      } else box.style.display = "none";
      st.textContent = `${p.found ? "keyboard " + p.angle + "°" : "no keyboard"} · pose ${p.latency_ms} ms · coach ${lastLat ? (lastLat / 1000).toFixed(1) + " s" : "…"} · ${nFrames} frames`;
      dot.classList.add("on");
    } catch (e) { st.textContent = "can't reach Spanner: " + e.message; dot.classList.remove("on"); }
    busyPose = false;
  }
  setTimeout(poseLoop, 250);
}
async function frameLoop() {
  if (!busyFrame && v.videoWidth) {
    busyFrame = true;
    try { const r = await post("/coach/frame", await grab(1280, 0.85), { current_step: "0" }); nFrames++; lastLat = r.latency_ms;
      st.textContent = `${r.what_i_see ? r.what_i_see.slice(0, 60) : "…"} · step ${r.step_index} · ${(r.latency_ms / 1000).toFixed(1)} s${r.missing_keys?.length ? " · missing: " + r.missing_keys.join(",") : ""}`; dot.classList.add("on"); }
    catch (e) { st.textContent = "can't reach Spanner: " + e.message; dot.classList.remove("on"); }
    busyFrame = false;
  }
  setTimeout(frameLoop, 1500);
}
document.getElementById("start").onclick = async () => {
  try {
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    document.getElementById("start").remove(); st.textContent = "streaming"; if (QP.get("track") === "1") poseLoop(); frameLoop();
    watchPalm(v, () => { fetch(API + "/coach/signal", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session: S, signal: "stop" }) }).catch(() => {}); st.textContent = "✋ stop sent"; });
    if (screen.orientation?.lock) screen.orientation.lock("landscape").catch(() => {});
  } catch (e) { st.textContent = "camera blocked: " + e.message + " (open this page over https and allow the camera)"; }
};
</script>
</body></html>
