<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanner · device hologram</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  /* The same design tokens as the laptop viewer (index.html): green on black, Inter, calm panels. */
  @font-face { font-family:"Inter"; font-weight:400; src:local("Inter Regular"), local("Inter"), url("./vendor/fonts/Inter_400Regular.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Inter"; font-weight:500; src:local("Inter Medium"), url("./vendor/fonts/Inter_500Medium.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Inter"; font-weight:600; src:local("Inter SemiBold"), url("./vendor/fonts/Inter_600SemiBold.ttf") format("truetype"); font-display:swap; }
  :root { --base:#101512; --raised:#253027; --scene:#131a15; --text:#f2f2e9; --muted:#a0a99f; --line:#354137; --action:#caf879; --on-action:#172415; --danger:#f3917c; --warn:#ffd166; --ok:#caf879; --scrim:rgba(5,8,5,.42); }
  html,body { margin:0; height:100%; background:var(--scene); overflow:hidden; font-family:Inter,"Segoe UI",system-ui,sans-serif; color:var(--text); font-size:15px; line-height:1.35; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .hud { position:fixed; z-index:5; }
  .panel { background:var(--raised); border:1px solid var(--line); border-radius:12px; color:var(--text); box-shadow:0 8px 28px rgba(0,0,0,.18); }
  #top { top:16px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:flex-start; }
  #brand { font-size:14px; font-weight:600; padding-top:6px; } #brand b { color:var(--action); font-weight:600; }
  #status { font-size:12px; color:var(--muted); text-align:right; line-height:1.7; }
  #listen { font-size:12px; color:var(--muted); }
  #listen.on { color:var(--action); } #listen.on::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--action); margin-right:6px; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  @media (prefers-reduced-motion:reduce) { #listen.on::before { animation:none; } }
  #insp { right:20px; top:72px; width:320px; padding:14px 16px; display:none; }
  #insp h3 { margin:0 0 4px; font-size:15px; font-weight:600; }
  #insp p { margin:6px 0 4px; font-size:13.5px; line-height:1.45; }
  #insp .k { font-size:12px; color:var(--muted); margin-top:6px; }
  .tag { font-size:12px; font-weight:600; color:var(--on-action); background:var(--action); padding:3px 9px; border-radius:6px; white-space:nowrap; }
  .tag.red { background:var(--danger); color:#1a0d0a; }
  .callout { font-size:11px; letter-spacing:.06em; color:var(--text); opacity:.8; white-space:nowrap; background:rgba(16,21,18,.7); padding:2px 7px; border-radius:6px; border:1px solid var(--line); }
  #note { left:20px; bottom:20px; max-width:560px; padding:12px 16px; font-size:14px; line-height:1.45; }
  #note b { font-size:12px; font-weight:600; color:var(--action); display:block; margin-bottom:6px; }
  #heard { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); padding:8px 14px; font-size:13px; display:none; z-index:6; }
  #heard b { color:var(--action); font-weight:600; }
  #wake { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:20; background:var(--scrim); backdrop-filter:blur(6px); cursor:pointer; text-align:center; }
  #wake .box { background:var(--base); border:1px solid var(--line); border-radius:16px; padding:32px 40px; max-width:520px; box-shadow:0 18px 60px rgba(0,0,0,.35); }
  #wake .big { font-size:26px; font-weight:500; margin-bottom:8px; }
  #wake small { display:block; font-size:12px; color:var(--muted); line-height:1.5; }
</style></head>
<body>
<canvas id="c"></canvas><div id="labels"></div>
<div class="hud" id="top"><div id="brand">Spanner <b id="dev">Device</b> hologram</div><div id="status"><span id="mode">Standby</span><br><span id="tele"></span><br><span id="listen">Mic off</span></div></div>
<div class="hud panel" id="insp"><h3 id="ih">PART</h3><p id="ip"></p><div class="k" id="ik"></div></div>
<div class="hud panel" id="note"><b id="nb">Hologram</b><span id="nt"></span></div>
<div class="panel" id="heard"></div>
<div id="wake"><div class="box"><div class="big">Tap to wake Spanner</div><small>Then just talk: "take it apart", "show me the battery", "put it back", "x-ray", "keyboard".</small></div></div>
<script type="module" src="./device.js"></script>
</body></html>
